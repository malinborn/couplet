[package]
name = "md-mini"
version = "1.0.0"
description = "Minimalist live-preview markdown editor for macOS"
authors = ["md-mini"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "md_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-cli = "2.4.1"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-fs = "2.4.5"
notify = { version = "8.2.0", features = ["macos_fsevent"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-shell = "2"
dirs = "6.0.0"
cocoa = "0.26"
# DEV-ONLY agent driving bridge. `optional = true` + the `mcp-bridge` feature
# below means that with the feature off this crate is NOT COMPILED AT ALL — it is
# absent from the binary, not merely disabled at runtime.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

[features]
# Deliberately EMPTY. `mcp-bridge` must never become a default feature.
default = []
# Enable ONLY for local dev: `npm run tauri dev -- --features mcp-bridge`.
# `tauri/dynamic-acl` is pulled in HERE rather than in the base `tauri` dependency
# on purpose: the bridge's webview->host commands need an ACL grant, and granting
# it at runtime behind this feature keeps `capabilities/default.json` clean.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge", "tauri/dynamic-acl"]
